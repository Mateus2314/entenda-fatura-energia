spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    url: ${DB_URL}
    user: ${DB_USER}
    password: ${DB_PASS}
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

application:
  security:
    jwt:
      secret-key: "c2VjcmV0LWtleS1mb3Itand0LXRlc3RpbmctZW52aXJvbm1lbnQtbXVzdC1iZS1sb25nLWVub3VnaA=="
      expiration: 3600000