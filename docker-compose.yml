services:
  postgres:
    image: postgres:17
    container_name: energia-db
    ports:
      - "5433:5432"   # porta externa 5433 mapeada para 5432 interna
    environment:
      POSTGRES_DB: energia
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - energia-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energia-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/energia
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      - postgres
    restart: always
    networks:
      - energia-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energia-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    restart: always
    networks:
      - energia-network

networks:
  energia-network:
    driver: bridge

volumes:
  pgdata: